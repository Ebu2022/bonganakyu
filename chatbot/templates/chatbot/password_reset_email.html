<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>

<body style="font-family: Arial; background:#f4f4f4; padding:30px;">

    <div style="max-width:600px; margin:auto; background:white; padding:30px; border-radius:8px;">

        <h2 style="color:#1a5f4a;">University Assistant</h2>

        <p>Hello {{ user.username }},</p>

        <p>You requested to reset your password.</p>

        <p>Click the button below to set a new password:</p>

        <p style="text-align:center;">
            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
                style="background:#1a5f4a; color:white; padding:12px 20px; text-decoration:none; border-radius:5px;">
                Reset Password
            </a>
        </p>

        <p>If you did not request this, please ignore this email.</p>

        <hr>

        <p style="font-size:12px; color:gray;">
            University Support System
        </p>

    </div>

</body>

</html>
